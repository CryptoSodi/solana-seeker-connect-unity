<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seeker Connect</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a121b; }
    #unity-canvas { display: block; width: 100%; height: 100%; outline: none; }
    #unity-loading-container { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; color: #e8eff4; font: 16px system-ui, sans-serif; text-align: center; background: #0a121b; }
    progress { width: min(280px, 80vw); accent-color: #8becc3; }
    #load-error { max-width: 460px; padding: 24px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0" aria-label="Seeker Connect wallet demo"></canvas>
  <div id="unity-loading-container" role="status">
    <span>Loading Seeker Connect…</span>
    <progress id="load-progress" max="1" value="0"></progress>
    <span id="load-error" hidden></span>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const loading = document.getElementById('unity-loading-container');
    const error = document.getElementById('load-error');
    function showError(message) {
      loading.style.display = 'grid';
      error.hidden = false;
      error.textContent = message;
    }
    createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: 1,
      showBanner: (message, type) => { if (type === 'error') showError(message); }
    }, progress => { document.getElementById('load-progress').value = progress; })
      .then(() => { loading.style.display = 'none'; })
      .catch(() => showError('Unable to load the app. Refresh the page or try a browser with WebGL 2 support.'));
  </script>
</body>
</html>
